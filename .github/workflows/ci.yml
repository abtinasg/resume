name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Tests and CI never call paid model APIs; AI tests use a fake client.
  OPENAI_API_KEY: ''

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  calibration:
    # Uncalibrated scoring expectations (see docs/decisions/DECISION_LOG.md, D-014).
    # Reported on every PR but not blocking until reference data exists.
    name: Scoring calibration (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run calibration suites and report
        run: |
          set +e
          npm run test:calibration > calibration.log 2>&1
          status=$?
          summary=$(grep -E '^Tests:' calibration.log | tail -1)
          echo "### Scoring calibration (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "${summary:-no summary}" >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            echo "::warning title=Scoring calibration::${summary} (expected until D-014 is resolved)"
          fi
          exit 0
